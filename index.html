  /* ================= FLOATING BUTTON ================= */

  #auth .crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:30px;filter:drop-shadow(0 4px 10px rgba(255,211,77,.7))}

  #auth .row{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#b9c2e0;margin-bottom:18px;cursor:pointer}

  #panel{

  /* grid */
  .grid{position:relative;z-index:2;display:grid;grid-template-columns:.95fr 1.25fr .95fr;gap:8px}

  .side{

  .side.big{background:linear-gradient(180deg,#7c1449 0%,#2a0619 100%);border-color:#ff4fa3;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 24px rgba(0,0,0,.6)}
  .side.predicted{transform:translateY(-3px) scale(1.02);border-color:var(--gold);box-shadow:0 0 22px rgba(255,211,77,.7),0 12px 28px rgba(0,0,0,.8)}

  .tag.off{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#7a839f}

  .center .no-val:hover{color:var(--cyan)}

  .orb-wrap{position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center;margin:6px 0}
  .ring-ticks{position:absolute;inset:0;border-radius:50%;

  .ring-glow{position:absolute;inset:9px;border-radius:50%;box-shadow:0 0 20px rgba(56,232,255,.5) inset,0 0 28px rgba(56,232,255,.4)}
  .orb{
    width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;

  .ball{width:100%;aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:950;border:1px solid rgba(255,255,255,.85);box-shadow:inset -2px -3px 5px rgba(0,0,0,.35),inset 2px 3px 5px rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.7)}

  .ball.v{background:radial-gradient(circle at 30% 25%,#e6b8ff,#9a3ae8 60%,#4a0f85);color:#2b0752}

  /* telegram */

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);padding:9px 18px;border-radius:11px;font-size:12.5px;font-weight:800;background:linear-gradient(180deg,#9bffc9,#0ba85a);color:#003b1a;box-shadow:0 10px 24px rgba(11,168,90,.5);opacity:0;pointer-events:none;transition:.3s;z-index:10002}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

  if(voiceOn){b.textContent="🔊 ON";b.classList.add("on");b.classList.remove("off");}
  else{b.textContent="🔇 OFF";b.classList.add("off");b.classList.remove("on");}
}

}
