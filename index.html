        const VoiceSystem = (() => {
            const queue = [];
            let active = false;
            let femaleVoice = null;

            function findFemaleVoice() {
                if (!("speechSynthesis" in window)) return null;
                const voices = window.speechSynthesis.getVoices() || [];
                if (!voices.length) return null;

                const maleRe = /\b(male|man|boy|rishi|prabhat|amit|arjun|david|mark|alex|daniel|george|ryan|thomas|eric|brian|fred|albert)\b/i;
                const femaleRe = /(female|woman|girl|lady|tanisha|nabila|priya|lekha|aditi|raveena|sangeeta|kalpana|zira|samantha|victoria|moira|fiona|veena|aria|jenny|allison|ava|zoe|karen|tessa|google.*(female|hindi|bn)|microsoft.*(tanisha|aria|jenny|zira))/i;

                const matches = voices.filter((v) => !maleRe.test(v.name) && femaleRe.test(v.name));
                return (
                    matches.find((v) => /bn|bangla|bengali/i.test(v.lang) || /bn|bangla|bengali/i.test(v.name)) ||
                    matches.find((v) => /hi|en-in|en-gb|en-us/i.test(v.lang)) ||
                    matches[0] ||
                    voices.filter((v) => !maleRe.test(v.name))[0] ||
                    null
                );
            }

                if (active || !State.voiceOn || !("speechSynthesis" in window)) return;
                const line = queue.shift();

                utter.pitch = 1.78;
                utter.rate = 0.94;

                let closed = false;

                    if (closed) return;
                    closed = true;
                    clearTimeout(watchdog);
                    active = false;
                    setTimeout(processNext, 180);
                };

                const watchdog = setTimeout(done, 5500);
                utter.onend = done;
                utter.onerror = done;

                try {
                    window.speechSynthesis.speak(utter);
                } catch (_) {
                    done();
                }
            }

            function speak(text) {
                if (!State.voiceOn || !("speechSynthesis" in window) || !text) return;
                const clean = String(text).trim();
                if (!clean || queue[queue.length - 1] === clean) return;
                queue.push(clean);
                processNext();
            }

            function syncUI() {
                const btn = document.getElementById("voice-toggle-btn");

                btn.textContent = State.voiceOn ? "👩 VOICE" : "🔇 MUTE";

                localStorage.setItem("tuhin_female_voice_enabled", String(State.voiceOn));
                syncUI();
                if (!State.voiceOn) {
                    queue.length = 0;

                    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                } else {
                    speak("সবাই এখানে একটা বিগ ট্রেড করো!");
                }
            }

            if ("speechSynthesis" in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    femaleVoice = findFemaleVoice();
                };

            return { speak, toggle, syncUI };

        const PlatformSystem = (() => {

        const PanelUI = (() => {

            function hide() {

            function handleIconTap() {

                } else {
                    document.getElementById("error-msg").style.display = "none";
                    document.getElementById("auth-overlay").style.display = "block";
                }
            }

            function enableDrag(boxEl, handleEl, onTap) {
                let dragging = false, moved = false, startX = 0, startY = 0, initL = 0, initT = 0;

                function begin(x, y) {
                    const r = boxEl.getBoundingClientRect();
                    initL = r.left;
                    initT = r.top;
                    startX = x;
                    startY = y;
                    dragging = true;
                    moved = false;
                    boxEl.style.left = `${initL}px`;
                    boxEl.style.top = `${initT}px`;
                    boxEl.style.right = "auto";
                    boxEl.style.bottom = "auto";
                    boxEl.style.transform = "none";
                }

                function drag(x, y) {
                    if (!dragging) return;
                    const dx = x - startX, dy = y - startY;
                    if (Math.hypot(dx, dy) > 6) moved = true;
                    const maxL = Math.max(4, window.innerWidth - boxEl.offsetWidth - 4);
                    const maxT = Math.max(4, window.innerHeight - boxEl.offsetHeight - 4);
                    boxEl.style.left = `${Math.max(4, Math.min(maxL, initL + dx))}px`;
                    boxEl.style.top = `${Math.max(4, Math.min(maxT, initT + dy))}px`;
                }

                function stop() {
                    if (!dragging) return;
                    dragging = false;
                    if (!moved && typeof onTap === "function") onTap();
                }

                handleEl.addEventListener("touchstart", (e) => {
                    if (e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                    if (e.touches.length === 1) begin(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                handleEl.addEventListener("touchmove", (e) => {
                    if (!dragging || e.touches.length !== 1) return;
                    e.preventDefault();
                    drag(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: false });

                handleEl.addEventListener("touchend", stop);
                handleEl.addEventListener("touchcancel", stop);

                handleEl.addEventListener("mousedown", (e) => {
                    if (e.button !== 0 || e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                    begin(e.clientX, e.clientY);
                    function onMove(ev) { drag(ev.clientX, ev.clientY); }
                    function onUp() {
                        document.removeEventListener("mousemove", onMove);
                        document.removeEventListener("mouseup", onUp);
                        stop();
                    }
                    document.addEventListener("mousemove", onMove);
                    document.addEventListener("mouseup", onUp);
                });
            }

            return { open, hide, handleIconTap, enableDrag };
        })();

        const AuthSystem = (() => {

        const EngineSystem = (() => {
            function hash32(seed) {
                let x = seed >>> 0;
                x ^= x >>> 16;
                x = Math.imul(x, 0x7feb352d) >>> 0;
                x ^= x >>> 15;
                x = Math.imul(x, 0x846ca68b) >>> 0;
                x ^= x >>> 16;
                return x >>> 0;
            }

            function getSalt(cfg) {
                return (cfg.salt ^ (APP_DATA.platforms[State.platform]?.saltMix || 0)) >>> 0;
            }

            function getOrbStyle(num) {
                if (num === 0) return { orbClass: "orb-violet", ballClass: "b-violet-red", colorName: "VIOLET+RED" };
                if (num === 5) return { orbClass: "orb-violet", ballClass: "b-violet-green", colorName: "VIOLET+GRN" };
                if ([1, 3, 7, 9].includes(num)) return { orbClass: "orb-green", ballClass: "b-green", colorName: "GREEN" };
                return { orbClass: "orb-red", ballClass: "b-red", colorName: "RED" };
            }

            function baseDigit(slot, cfg, dateSeed) {
                const s = getSalt(cfg);
                const h1 = hash32((dateSeed ^ Math.imul(slot, s)) >>> 0);
                const h2 = hash32(h1 ^ (slot * 2654435761));
                const type = (h1 % 100) >= 50 ? "BIG" : "SMALL";
                const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                return pool[h2 % pool.length];
            }

            function computeSignal(slot, cfg, dateSeed) {
                const s = getSalt(cfg);
                const h1 = hash32((dateSeed ^ Math.imul(slot, s)) >>> 0);
                const h2 = hash32(h1 ^ (slot * 2654435761));

                let streakType = null, streak = 0, bigCnt = 0;
                for (let i = 1; i <= 5; i++) {
                    const prev = Math.max(1, slot - i);
                    const isB = (hash32((dateSeed ^ Math.imul(prev, s)) >>> 0) % 100) >= 49;
                    if (isB) bigCnt++;
                    if (i === 1) {
                        streakType = isB ? "BIG" : "SMALL";
                        streak = 1;
                    } else if (((isB ? "BIG" : "SMALL") === streakType) && streak === i - 1) {
                        streak++;
                    }
                }

                let score = h1 % 100;
                if (streakType === "BIG" && streak >= 3) score -= 18;
                else if (streakType === "SMALL" && streak >= 3) score += 18;
                if (bigCnt >= 4) score -= 10;
                if (bigCnt <= 1) score += 10;

                const type = score >= 50 ? "BIG" : "SMALL";
                const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                const idx = h2 % pool.length;
                let num = pool[idx];
                if (slot > 1 && num === baseDigit(slot - 1, cfg, dateSeed)) {
                    num = pool[(idx + 1) % pool.length];
                }

                const confidence = Math.min(94, Math.max(76, 78 + Math.floor(Math.abs(score - 50) * 0.65) + (h2 % 6)));
                return { type, num, confidence, ...getOrbStyle(num) };
            }

            function wasWin(slot, cfg, dateSeed, pred) {
                const h = hash32((dateSeed ^ Math.imul(slot, getSalt(cfg)) ^ 0x517CC1B7) >>> 0);
                return (pred.type === "BIG") === ((h % 100) >= 50);
            }

            function renderBalls(cfg, indexToday, dateSeed) {
                const box = document.getElementById("recent-wheels");
                box.innerHTML = "";
                for (let i = 9; i >= 0; i--) {
                    const item = computeSignal(Math.max(1, indexToday - i), cfg, dateSeed);
                    const dot = document.createElement("div");
                    dot.className = `mini-ball text-3d ${item.ballClass}`;
                    dot.textContent = String(item.num);
                    box.appendChild(dot);
                }
            }

            function addWin() {
                State.wins++;
                document.getElementById("wl-status").textContent = `W: ${State.wins} | L: ${State.losses}`;
                document.getElementById("ai-call-banner").textContent = "👩 অভিনন্দন! এই ট্রেড উইন হয়েছে!";
                VoiceSystem.speak("অভিনন্দন! এই ট্রেড উইন হয়েছে!");
            }

            function addLoss() {
                State.losses++;
                document.getElementById("wl-status").textContent = `W: ${State.wins} | L: ${State.losses}`;
                document.getElementById("ai-call-banner").textContent = "👩 দুঃখিত, এই ট্রেড লস হয়েছে!";
                VoiceSystem.speak("দুঃখিত, এই ট্রেড লস হয়েছে!");

            function copyPeriod() {
                const val = document.getElementById("period-num").innerText.trim();

            function update() {
                if (!State.unlocked) return;
                const cfg = APP_DATA.markets[State.market] || APP_DATA.markets["30S"];
                const now = new Date();
                const sec = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                const indexToday = Math.floor(sec / cfg.duration) + 1;
                const elapsed = sec % cfg.duration;
                const left = cfg.duration - elapsed;

                const dStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, "0")}${String(now.getUTCDate()).padStart(2, "0")}`;
                const dSeed = parseInt(dStr, 10) || 20261127;
                const period = `${dStr}1000${String(cfg.offset + indexToday).padStart(5, "0")}`;

                document.getElementById("period-num").innerText = period;
                document.getElementById("timer-display").innerText = `${String(left).padStart(2, "0")}s`;

                let changed = false;
                let resultVoice = "";

                if (period !== State.periodCache) {
                    if (State.periodCache && State.lastPred && indexToday > 1) {
                        if (wasWin(indexToday - 1, cfg, dSeed, State.lastPred)) {
                            State.wins++;
                            resultVoice = "অভিনন্দন! আগের ট্রেড উইন হয়েছে!";
                        } else {
                            State.losses++;
                            resultVoice = "দুঃখিত, আগের ট্রেড লস হয়েছে!";
                        }
                        document.getElementById("wl-status").textContent = `W: ${State.wins} | L: ${State.losses}`;
                    }
                    State.periodCache = period;
                    State.currentPred = computeSignal(indexToday, cfg, dSeed);
                    State.lastPred = { ...State.currentPred };
                    changed = true;
                }

                const orb = document.getElementById("main-orb");
                const orbTxt = document.getElementById("main-orb-text");
                const bigCard = document.getElementById("big-panel");
                const smallCard = document.getElementById("small-panel");
                const bigTag = document.getElementById("big-tag");
                const smallTag = document.getElementById("small-tag");

                if (elapsed <= 2) {
                    orbTxt.innerText = "...";
                    orb.className = "num-orb orb-violet text-3d";
                    document.getElementById("color-label").innerText = "SCANNING";
                    document.getElementById("conf-label").innerText = "SYNC...";
                    document.getElementById("ai-call-banner").textContent = resultVoice ? `👩 ${resultVoice}` : "👩 সিগন্যাল স্ক্যান হচ্ছে...";

                    const callMsg = p.type === "BIG" ? "সবাই এখানে একটা বিগ ট্রেড করো!" : "সবাই এখানে একটা স্মল ট্রেড করো!";
                    orbTxt.innerText = String(p.num);
                    orb.className = `num-orb ${p.orbClass} text-3d`;
                    document.getElementById("color-label").innerText = p.colorName;
                    document.getElementById("conf-label").innerText = `CONF ${p.confidence}%`;
                    document.getElementById("ai-call-banner").textContent = `👩 ${callMsg}`;

                    const isBig = p.type === "BIG";
                    bigCard.classList.toggle("is-live", isBig);
                    smallCard.classList.toggle("is-live", !isBig);
                    bigTag.innerText = isBig ? "ACTIVE" : "SKIP";
                    smallTag.innerText = !isBig ? "ACTIVE" : "SKIP";
                    bigTag.className = `side-badge text-3d ${isBig ? "live" : ""}`;
                    smallTag.className = `side-badge text-3d ${!isBig ? "live" : ""}`;
                }

                if (changed && State.announcedPeriod !== period) {
                    State.announcedPeriod = period;
                    const p = State.currentPred;
                    const callMsg = p.type === "BIG" ? "সবাই এখানে একটা বিগ ট্রেড করো!" : "সবাই এখানে একটা স্মল ট্রেড করো!";
                    const numWord = APP_DATA.digitsBn[p.num] ?? p.num;
                    if (resultVoice) VoiceSystem.speak(resultVoice);
                    VoiceSystem.speak(`${callMsg} নম্বর ${numWord}।`);
                }

                renderBalls(cfg, indexToday, dSeed);
            }

            function start() {
                update();
                if (!State.running) {
                    State.running = true;
                    setInterval(update, 1000);
                }
            }

            return { update, start, addWin, addLoss, copyPeriod };
        })();

            if (e.key === "Enter") AuthSystem.unlock();
        });

        document.querySelectorAll(".mkt-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".mkt-btn").forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                State.market = btn.dataset.market;
                PlatformSystem.updateHeader();
                State.periodCache = "";
                State.announcedPeriod = "";
                State.lastPred = null;
                EngineSystem.update();
                VoiceSystem.speak(`${APP_DATA.markets[State.market].bnName} মার্কেট চালু হয়েছে।`);
            });
        });

        PanelUI.enableDrag(
            document.getElementById("floating-icon-btn"),
            document.getElementById("floating-icon-btn"),
            PanelUI.handleIconTap
        );
        PanelUI.enableDrag(
            document.getElementById("main-content"),
            document.getElementById("main-content-header"),
            null
        );
    </script>
</body>
</html>
