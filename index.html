        #floating-icon-btn img {

        .tg-btn svg {

<body>

    <script>
        let currentDuration = 30;
        let marketCode = "30S";
        let lastPeriod = "";

        function changeMarket(duration, code) {
            currentDuration = duration;
            marketCode = code;

            document.querySelectorAll('.market-btn').forEach(btn => btn.classList.remove('active'));
            if(code === '30S') document.getElementById('m-30s').classList.add('active');
            if(code === '1M') document.getElementById('m-1m').classList.add('active');
            if(code === '3M') document.getElementById('m-3m').classList.add('active');
            if(code === '5M') document.getElementById('m-5m').classList.add('active');

            document.getElementById('market-label').innerText = `AI (${code} MARKET)`;
            lastPeriod = "";
            updateTimer();
        }

        function triggerAuth() {
            document.getElementById('auth-overlay').style.display = 'flex';
        }

        function checkPassword() {
            const inputVal = document.getElementById('pass-input').value;
            if (inputVal === "A-N-HGZY-70") {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('floating-icon-btn').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                updateTimer();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        function closeHack() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('floating-icon-btn').style.display = 'block';
        }

        /* 🖱️ DRAGGABLE FLOATING ICON LOGIC 📱 */
        const iconBtn = document.getElementById("floating-icon-btn");
        let isIconDragging = false, iconStartX, iconStartY, iconInitX, iconInitY, iconMoved = false;

        iconBtn.addEventListener("mousedown", dragIconStart);
        document.addEventListener("mousemove", dragIcon);
        document.addEventListener("mouseup", dragIconEnd);

        iconBtn.addEventListener("touchstart", dragIconStart, { passive: true });
        document.addEventListener("touchmove", dragIcon, { passive: false });
        document.addEventListener("touchend", dragIconEnd);

        function dragIconStart(e) {
            isIconDragging = true;
            iconMoved = false;
            let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            iconStartX = clientX;
            iconStartY = clientY;
            iconInitX = iconBtn.offsetLeft;
            iconInitY = iconBtn.offsetTop;
        }

        function dragIcon(e) {
            if (!isIconDragging) return;
            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            let dx = clientX - iconStartX;
            let dy = clientY - iconStartY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                iconMoved = true;
                if (e.cancelable && e.type === "touchmove") e.preventDefault();
                iconBtn.style.left = (iconInitX + dx) + "px";
                iconBtn.style.top = (iconInitY + dy) + "px";
                iconBtn.style.bottom = 'auto';
                iconBtn.style.right = 'auto';
            }
        }

        function dragIconEnd() {
            if (!iconMoved && isIconDragging) {
                triggerAuth();
            }
            isIconDragging = false;
        }

        // TOUCH & DRAG FIX FOR HACK POPUP
        const box = document.getElementById("main-content");
        const header = document.getElementById("drag-header");
        let isDragging = false, startX, startY, initialX, initialY;

        header.addEventListener("mousedown", dragStart);
        window.addEventListener("mousemove", drag);
        window.addEventListener("mouseup", dragEnd);

        header.addEventListener("touchstart", dragStart, { passive: false });
        window.addEventListener("touchmove", drag, { passive: false });
        window.addEventListener("touchend", dragEnd);

        function dragStart(e) {
            isDragging = true;
            let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            initialX = box.offsetLeft;
            initialY = box.offsetTop;
        }

        function drag(e) {
            if (!isDragging) return;
            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
            let dx = clientX - startX;
            let dy = clientY - startY;
            
            box.style.left = (initialX + dx) + "px";
            box.style.top = (initialY + dy) + "px";

            if (e.cancelable) e.preventDefault();
        }

        function dragEnd() {
            isDragging = false;
        }

        /* Stable Timer & Fully Matched Period Logic (No trimming) */
        function updateTimer() {
            const now = new Date();
            const totalSecondsToday = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
            
            let periodIndex = Math.floor((now.getTime() / 1000) / currentDuration) + 1431;
            let dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
            
            // সম্পূর্ণ অরিজিনাল পিরিয়ড নাম্বার (যেমন: 20261111100051431)
            let fullPeriodNumber = `${dateStr}${marketCode === '30S' ? '1000' : marketCode === '1M' ? '1000' : marketCode === '3M' ? '3000' : '5000'}${periodIndex}`;
            let timeLeft = currentDuration - (Math.floor(now.getTime() / 1000) % currentDuration);
            
            document.getElementById('p-id').innerText = fullPeriodNumber;
            document.getElementById('timer').innerText = (timeLeft < 10 ? "0" : "") + timeLeft + "s";

            if (fullPeriodNumber !== lastPeriod) {
                lastPeriod = fullPeriodNumber;
                generateHighAccuracySignal(fullPeriodNumber);
            }
        }

        function generateHighAccuracySignal(periodStr) {
            let seed = parseInt(periodStr);
            let x = Math.sin(seed * 73.156) * 10000;
            let randomFactor = Math.abs(x - Math.floor(x));

            let isBig = (seed % 2 === 0);
            if (randomFactor > 0.45) isBig = !isBig;

            let predictedSize = isBig ? "BIG" : "SMALL";
            let sizeEl = document.getElementById('res-size');
            sizeEl.innerText = predictedSize;
            sizeEl.style.color = predictedSize === "BIG" ? "#ff3333" : "#00ff88";

            let confidenceScore;
            if (predictedSize === "SMALL" && randomFactor < 0.3) {
                confidenceScore = 98;
            } else if (randomFactor > 0.7) {
                confidenceScore = 96;
            } else if (randomFactor > 0.4) {
                confidenceScore = 88;
            } else {
                confidenceScore = 79;
            }
            document.getElementById('acc-text').innerText = `ACCURACY: ${confidenceScore}%`;

            const bigPool = [5, 6, 7, 8, 9];
            const smallPool = [0, 1, 2, 3, 4];
            
            let num1, num2;
            if (isBig) {
                num1 = bigPool[Math.floor(Math.abs(Math.sin(seed * 12.3)) * bigPool.length)];
                num2 = bigPool[Math.floor(Math.abs(Math.cos(seed * 45.6)) * bigPool.length)];
            } else {
                num1 = smallPool[Math.floor(Math.abs(Math.sin(seed * 12.3)) * smallPool.length)];
                num2 = smallPool[Math.floor(Math.abs(Math.cos(seed * 45.6)) * smallPool.length)];
            }
            
            updateNumCircleStyle('num-1', num1);
            updateNumCircleStyle('num-2', num2);
        }

        function updateNumCircleStyle(elementId, num) {
            let el = document.getElementById(elementId);
            el.innerText = num;
            
            if (num === 0) {
                el.style.border = "2px solid #9c27b0";
                el.style.color = "#ba68c8";
                el.style.boxShadow = "0 0 8px rgba(156, 39, 176, 0.8)";
            } else if (num === 5) {
                el.style.border = "2px solid #9c27b0";
                el.style.color = "#ba68c8";
                el.style.boxShadow = "0 0 8px rgba(156, 39, 176, 0.8)";
            } else if (num % 2 === 0) {
                el.style.border = "2px solid #ff3333";
                el.style.color = "#ff3333";
                el.style.boxShadow = "0 0 8px rgba(255, 51, 51, 0.7)";
            } else {
                el.style.border = "2px solid #00ff88";
                el.style.color = "#00ff88";
                el.style.boxShadow = "0 0 8px rgba(0, 255, 136, 0.7)";
            }
        }

        setInterval(() => {
            if (document.getElementById('main-content').style.display === 'block') {
                updateTimer();
            }
        }, 1000);
    </script>
</body>
</html>
