<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOHIRUL AVIATOR - @BDTCODER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Orbitron:wght@700;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background: #06030d;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .panel {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(180deg, #17082b 0%, #090313 100%);
            border: 2px solid #ff0055;
            border-radius: 26px;
            padding: 18px 16px;
            box-shadow: 0 0 32px rgba(255, 0, 85, 0.45);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* লক স্ক্রিন */
        .lock-box {
            position: absolute;
            inset: 0;
            background: #090314;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 22px;
            gap: 12px;
            text-align: center;
        }

        .lock-box.hidden {
            display: none;
        }

        .icon-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .lock-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            color: #fff;
        }

        .lock-sub {
            font-size: 11.5px;
            color: #94a3b8;
        }

        .pass-inp {
            width: 100%;
            padding: 11px;
            border-radius: 12px;
            border: 1.5px solid #00f0ff;
            background: #0f172a;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 13px;
            outline: none;
        }

        .unlock-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5);
        }

        .err-text {
            color: #ff4d6d;
            font-size: 12px;
            font-weight: 700;
            min-height: 16px;
        }

        /* হেডার */
        .top-head {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .top-head svg {
            width: 24px;
            height: 24px;
        }

        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(90deg, #ff0055, #fff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .id-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 9.5px;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ফাটার সময় থেকে শুরু হওয়া টাইম পিরিয়ড বক্স */
        .burst-time-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #ff0055;
            border-radius: 15px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 0 14px rgba(255, 0, 85, 0.25);
        }

        .b-label {
            font-size: 10px;
            color: #cbd5e1;
            font-weight: 700;
        }

        .b-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #ffd700;
        }

        /* মেইন সিগন্যাল স্ক্রিন */
        .screen {
            background: radial-gradient(circle, #320642 0%, #0b0218 100%);
            border: 2px solid #00f0ff;
            border-radius: 20px;
            padding: 20px 12px;
            text-align: center;
            box-shadow: inset 0 0 22px rgba(0, 240, 255, 0.25);
            margin-bottom: 12px;
        }

        .plane {
            font-size: 26px;
            display: inline-block;
            animation: floatPlane 1.8s ease-in-out infinite;
        }

        @keyframes floatPlane {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .odd-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px #ff0055, 0 0 35px #00f0ff;
            line-height: 1.1;
            margin: 6px 0;
        }

        .target-badge {
            display: inline-block;
            font-size: 11.5px;
            font-weight: 700;
            color: #34d399;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            padding: 3px 12px;
            border-radius: 20px;
        }

        /* নেক্সট পপআপ কাউন্টডাউন */
        .timer-strip {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 13px;
            padding: 8px;
            text-align: center;
            margin-bottom: 12px;
        }

        .timer-strip span {
            font-size: 10.5px;
            color: #94a3b8;
            font-weight: 700;
        }

        .timer-strip strong {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #fbbf24;
            margin-top: 2px;
        }

        /* বাটন */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .btn-scan {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(0, 198, 255, 0.45);
        }

        .btn-play {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 16px;
            border: 1.5px solid #ffd700;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        /* অটো পপআপ */
        .auto-popup {
            position: absolute;
            inset: 0;
            background: rgba(5, 2, 14, 0.92);
            backdrop-filter: blur(5px);
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .auto-popup.show {
            opacity: 1;
            pointer-events: all;
        }

        .popup-card {
            width: 84%;
            background: #140826;
            border: 2px solid #ff0055;
            border-radius: 20px;
            padding: 20px 14px;
            text-align: center;
            box-shadow: 0 0 28px rgba(255, 0, 85, 0.5);
        }

        .ring-loader {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #00f0ff;
            border-right: 4px solid #ff0055;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .pop-head {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #00f0ff;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .pop-msg {
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        .bar-bg {
            width: 100%;
            height: 7px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00f0ff);
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="panel">
        <!-- পাসওয়ার্ড লক -->
        <div class="lock-box" id="lockBox">
            <div class="icon-ring">
                <svg viewBox="0 0 64 64" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M54 10L38 26L12 20L8 24L27 34L16 45L8 43L4 47L15 53L21 64L25 60L23 53L34 42L44 61L48 57L42 31L58 15C60 13 60 10 58 8C56 6 53 6 51 8L54 10Z" transform="translate(-2 -4)" fill="url(#pGrad)"/>
                    <defs>
                        <linearGradient id="pGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00F0FF"/>
                            <stop offset="1" stop-color="#FF0055"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="lock-title">JOHIRUL AVIATOR</div>
            <div class="lock-sub">@BDTCODER • Enter Password</div>
            <input type="password" class="pass-inp" id="passInp" placeholder="Password">
            <button class="unlock-btn" onclick="unlockApp()">ENTER</button>
            <div class="err-text" id="errText"></div>
        </div>

        <!-- অটোমেটিক পপআপ -->
        <div class="auto-popup" id="autoPopup">
            <div class="popup-card">
                <div class="ring-loader"></div>
                <div class="pop-head">ANALYZING...</div>
                <div class="pop-msg" id="popMsg">Catching crash time & period...</div>
                <div class="bar-bg">
                    <div class="bar-fill" id="barFill"></div>
                </div>
            </div>
        </div>

        <!-- হেডার -->
        <div class="top-head">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="28" stroke="#00F0FF" stroke-width="3"/>
                <path d="M20 42L44 22M44 22H28M44 22V38" stroke="#FF0055" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="title">AVIATOR HACK</div>
            <div class="id-tag">@BDTCODER</div>
        </div>

        <!-- যে সময়ে ফাটবে ওই সময় থেকে শুরু হওয়া পিরিয়ড ও টাইম -->
        <div class="burst-time-box">
            <div>
                <div class="b-label">BURST START TIME</div>
                <div class="b-val" id="burstTime">13:07:00</div>
            </div>
            <div style="text-align: right;">
                <div class="b-label">PERIOD</div>
                <div class="b-val" id="burstPeriod">#130700-01</div>
            </div>
        </div>

        <!-- সিগন্যাল ডিসপ্লে -->
        <div class="screen">
            <div class="plane">✈️</div>
            <div class="odd-val" id="oddVal">2.15x</div>
            <div class="target-badge" id="targetBadge">CASH OUT: 1.75x</div>
        </div>

        <!-- নেক্সট অটো পপআপ টাইমার -->
        <div class="timer-strip">
            <span>AUTO POPUP IN</span>
            <strong id="secCount">00 : 18</strong>
        </div>

        <!-- ডাইরেক্ট প্লে বাটন -->
        <div class="btn-stack">
            <button class="btn-scan" onclick="runPopup()">⚡ NEXT SIGNAL NOW</button>
            <a href="https://hgnice0.com/#/register?invitationCode=376851951983" target="_blank" class="btn-play">OPEN AVIATOR & PLAY</a>
        </div>
    </div>

    <script>
        const PASS = "Zahirul22369";
        let unlocked = false;
        let sec = 18;
        let stepNum = 1;

        function unlockApp() {
            const p = document.getElementById("passInp").value.trim();
            const err = document.getElementById("errText");
            if (p === PASS) {
                unlocked = true;
                document.getElementById("lockBox").classList.add("hidden");
                err.innerText = "";
                runPopup();
            } else {
                err.innerText = "পাসওয়ার্ড ভুল হয়েছে!";
            }
        }

        function runPopup() {
            if (!unlocked) return;
            const pop = document.getElementById("autoPopup");
            const msg = document.getElementById("popMsg");
            const bar = document.getElementById("barFill");

            pop.classList.add("show");
            bar.style.width = "20%";
            msg.innerText = "Syncing exact burst timestamp...";

            setTimeout(() => {
                bar.style.width = "65%";
                msg.innerText = "Generating time period & odd...";
            }, 600);

            setTimeout(() => {
                bar.style.width = "100%";
                pop.classList.remove("show");
                updateBurstSignal();
                sec = 18;
            }, 1300);
        }

        function updateBurstSignal() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, "0");
            const mm = String(now.getMinutes()).padStart(2, "0");
            const ss = String(now.getSeconds()).padStart(2, "0");
            const timeNow = `${hh}:${mm}:${ss}`;

            document.getElementById("burstTime").innerText = timeNow;
            document.getElementById("burstPeriod").innerText = `#${hh}${mm}${ss}-${String(stepNum).padStart(2, "0")}`;
            stepNum++;

            const r = Math.random();
            let odd;
            if (r < 0.65) {
                odd = (Math.random() * (2.75 - 1.35) + 1.35).toFixed(2);
            } else if (r < 0.9) {
                odd = (Math.random() * (5.20 - 2.76) + 2.76).toFixed(2);
            } else {
                odd = (Math.random() * (9.50 - 5.21) + 5.21).toFixed(2);
            }

            const safe = Math.max(1.20, (odd * 0.78)).toFixed(2);
            document.getElementById("oddVal").innerText = `${odd}x`;
            document.getElementById("targetBadge").innerText = `CASH OUT: ${safe}x`;
        }

        setInterval(() => {
            if (!unlocked) return;
            sec--;
            if (sec <= 0) {
                runPopup();
            }
            document.getElementById("secCount").innerText = `00 : ${String(sec).padStart(2, "0")}`;
        }, 1000);
    </script>
</body>
</html>
