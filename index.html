 return{orb:"red",color:"RED"};
}
function evalSlot(slot,cfg,dateSeed){
 var base=(dateSeed^Math.imul(slot,cfg.salt))>>>0;
 var h1=mixHash(base);
 var h2=mixHash(h1^(slot*2654435761));
 var bigCount=0;
 for(var lb=1;lb<=5;lb++){
  var pi=Math.max(1,slot-lb);
  var ph=mixHash((dateSeed^Math.imul(pi,cfg.salt))>>>0);
  if((ph%100)>=49)bigCount++;
 }
 var score=h1%100;
 if(bigCount>=4)score-=10;
 if(bigCount<=1)score+=10;
 var type=score>=50?"BIG":"SMALL";
 var pool=type==="BIG"?[5,6,7,8,9]:[0,1,2,3,4];
 var num=pool[h2%pool.length];
 var delta=Math.abs(score-50);
 var conf=Math.min(94,Math.max(76,78+Math.floor(delta*0.65)+(h2%6)));
 var c=getColor(num);
 return{type:type,num:num,confidence:conf,orb:c.orb,color:c.color};
}
function tick(){
 if(!unlocked)return;
 var cfg=MARKETS[market]||MARKETS["30S"];
 var now=new Date();
 var sec=now.getUTCHours()*3600+now.getUTCMinutes()*60+now.getUTCSeconds();
 var slot=Math.floor(sec/cfg.duration);
 var rem=sec%cfg.duration;
 var timeLeft=cfg.duration-rem;
 var elapsed=rem;
 var periodIdx=slot+1;
 var dateStr=""+now.getUTCFullYear()+String(now.getUTCMonth()+1).padStart(2,"0")+String(now.getUTCDate()).padStart(2,"0");
 var dateSeed=parseInt(dateStr,10)||20261121;
 var fmtIdx=String(cfg.offset+periodIdx).padStart(5,"0");
 var fullPeriod=dateStr+"1000"+fmtIdx;

 document.getElementById("period").textContent=fullPeriod;
 document.getElementById("timer").textContent=String(timeLeft).padStart(2,"0")+"s";

 var outcome="";
 if(fullPeriod!==periodCache){
  if(periodCache&&prev&&periodIdx>1){
   var oh=mixHash((dateSeed^Math.imul(periodIdx-1,cfg.salt)^0x517CC1B7)>>>0);
   var actualBig=(oh%100)>=50;
   var predBig=prev.type==="BIG";
   if(actualBig===predBig){wins++;outcome="অভিনন্দন! আগের ট্রেড উইন হয়েছে!";}
   else{losses++;outcome="দুঃখিত, আগের ট্রেড লস হয়েছে!";}
   document.getElementById("stat").textContent="W: "+wins+" | L: "+losses;
  }
  periodCache=fullPeriod;
  pred=evalSlot(periodIdx,cfg,dateSeed);
  prev={type:pred.type,num:pred.num};
 }

 var orb=document.getElementById("orb");
 var call=document.getElementById("call");
 var smallCard=document.getElementById("smallCard");
 var bigCard=document.getElementById("bigCard");
 var smallTag=document.getElementById("smallTag");
 var bigTag=document.getElementById("bigTag");
 var confEl=document.getElementById("conf");
 var recentLabel=document.getElementById("recentLabel");

 if(elapsed<=2){
  orb.textContent="...";
  orb.className="orb violet";
  recentLabel.textContent="RECENT RESULTS";
  confEl.textContent="SYNC...";
  call.textContent=outcome?"👩 "+outcome:"👩 সিগন্যাল স্ক্যান হচ্ছে...";
  smallCard.classList.remove("predicted");
  bigCard.classList.remove("predicted");
  smallTag.textContent="WAIT";smallTag.className="tag off";
  bigTag.textContent="WAIT";bigTag.className="tag off";
 }else{
  orb.textContent=String(pred.num);
  orb.className="orb "+pred.orb;
  recentLabel.textContent="RECENT RESULTS · "+pred.color;
  confEl.textContent="CONF "+pred.confidence+"%";
  call.textContent="👩 "+(pred.type==="BIG"?"সবাই এখানে একটা বিগ ট্রেড করো!":"সবাই এখানে একটা স্মল ট্রেড করো!");
  if(pred.type==="BIG"){
   bigCard.classList.add("predicted");smallCard.classList.remove("predicted");
   bigTag.textContent="✓ PREDICTED";bigTag.className="tag on-big";
   smallTag.textContent="✕ NOT PREDICTED";smallTag.className="tag off";
  }else{
   smallCard.classList.add("predicted");bigCard.classList.remove("predicted");
   smallTag.textContent="✓ PREDICTED";smallTag.className="tag on-small";
   bigTag.textContent="✕ NOT PREDICTED";bigTag.className="tag off";
  }
 }

 if(fullPeriod!==lastAnnounced){
  lastAnnounced=fullPeriod;
  if(voiceOn&&elapsed>2){
   var numBn=BN[pred.num]||pred.num;
   var sentence=(pred.type==="BIG"?"সবাই এখানে একটা বিগ ট্রেড করো!":"সবাই এখানে একটা স্মল ট্রেড করো!")+" নম্বর "+numBn+"।";
   if(outcome)speak(outcome+". "+sentence);
   else speak(sentence);
  }
 }

 var track=document.getElementById("track");
 track.innerHTML="";
 for(var k=9;k>=0;k--){
  var idx=Math.max(1,periodIdx-k);
  var s=evalSlot(idx,cfg,dateSeed);
  var b=document.createElement("div");
  b.className="ball "+(s.orb==="violet"?"v":s.orb.charAt(0));
  b.textContent=s.num;
  track.appendChild(b);
 }
}
function copyPeriod(){
 var t=document.getElementById("period").textContent.trim();
 if(t&&t!=="Loading..."){
  navigator.clipboard.writeText(t).then(function(){
   var toast=document.getElementById("toast");
   toast.classList.add("show");
   setTimeout(function(){toast.classList.remove("show");},1200);
  });
 }
}

/* ---------- simple drag (mouse only, won't block tap) ---------- */
(function(){
 var handle=document.getElementById("dragHandle");
 var panel=document.getElementById("panel");
 var dragging=false,ox=0,oy=0;
 handle.addEventListener("mousedown",function(e){
  if(e.target.closest("button"))return;
  dragging=true;
  var r=panel.getBoundingClientRect();
  ox=e.clientX-r.left;oy=e.clientY-r.top;
  panel.style.transform="none";
  e.preventDefault();
 });
 document.addEventListener("mousemove",function(e){
  if(!dragging)return;
  panel.style.left=(e.clientX-ox)+"px";
  panel.style.top=(e.clientY-oy)+"px";
 });
 document.addEventListener("mouseup",function(){dragging=false;});
})();
</script>
